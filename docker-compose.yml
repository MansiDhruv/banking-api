services:
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banking_api_db
    ports:
      - "3307:3306"
    volumes:
      - banking_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  banking-api:
    build: .
    container_name: banking-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_PASSWORD: root
      JWT_SECRET: ThisIsADevelopmentSecretKeyForJwtTokenGeneration123456
    ports:
      - "8080:8080"

volumes:
  banking_mysql_data: